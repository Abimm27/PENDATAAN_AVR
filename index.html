<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal SIM AVR</title>
  
  <!-- SDK Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #0056b3; }
    .logout-btn { background-color: #dc3545; }
    .logout-btn:hover { background-color: #c82333; }
    hr { margin: 20px 0; }
  </style>
</head>
<body>

  <div class="container">
    <!-- HALAMAN LOGIN -->
    <div id="login-section">
      <h2>Login Portal AVR</h2>
      <p>Masukkan NISN / ID Anda untuk masuk ke sistem.</p>
      <input type="text" id="inputNisn" placeholder="Ketik NISN / ID di sini...">
      <button onclick="handleLogin()">Masuk</button>
      <p id="statusLogin" style="color: red; font-weight: bold; text-align: center;"></p>
    </div>

    <!-- HALAMAN DASHBOARD -->
    <div id="dashboard-section" style="display: none;">
      <h2 id="welcomeText"></h2>
      <p id="infoKelas"></p>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>

      <hr>

      <!-- Form Reservasi -->
      <h3>Buat Reservasi Ruang AVR</h3>
      <label for="tanggalResv">Tanggal Peminjaman:</label>
      <input type="date" id="tanggalResv">
      
      <label for="keperluanResv">Keperluan:</label>
      <input type="text" id="keperluanResv" placeholder="Contoh: Rapat OSIS / Presentasi Fisika">
      
      <button onclick="kirimReservasi()">Ajukan Peminjaman</button>

      <hr>

      <!-- Daftar Jadwal -->
      <h3>Jadwal Mendatang Terkonfirmasi</h3>
      <ul id="listJadwal">
        <li>Memuat data dari database...</li>
      </ul>
    </div>
  </div>

  <script>
    // ==========================================
    // BAGIAN YANG HARUS KAMU UBAH SENDIRI
    // ==========================================

    // 1. GANTI INI DENGAN URL APPS SCRIPT KAMU
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwF9seeHdDJrAasLXP9xpq9lAYAmWMFfdAKIGaCfNlJFlN0ntP1FOPsJkE2huNgWDHL/exec";

    // 2. GANTI INI DENGAN CONFIG FIREBASE KAMU
    const firebaseConfig = {
      apiKey: "AIzaSyA6c6CUmLxSbvT47Uk8WO_3UJZ8jq6OCKY",
      authDomain: "pendataan-avr.firebaseapp.com",
      projectId: "pendataan-avr", // Ini sepertinya sudah benar sesuai nama projectmu
      storageBucket: "pendataan-avr.firebasestorage.app",
      messagingSenderId: "639304352995",
      appId: "1:639304352995:web:8ce74327f8afe60764b1d6"
    };

    // ==========================================
    // KODE LOGIKA APLIKASI (TIDAK PERLU DIUBAH)
    // ==========================================

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Cek Sesi Login
    window.onload = function() {
      const savedUser = localStorage.getItem('userName');
      if (savedUser) {
        tampilkanDashboard(savedUser, localStorage.getItem('userKelas'));
      }
    };

    // Fungsi Login (Cek NISN ke Spreadsheet)
    async function handleLogin() {
      const nisn = document.getElementById('inputNisn').value.trim();
      const statusText = document.getElementById('statusLogin');

      if (!nisn) {
        statusText.textContent = "NISN tidak boleh kosong!";
        return;
      }

      statusText.style.color = "blue";
      statusText.textContent = "Memverifikasi ke database sekolah...";

      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?nisn=${nisn}`);
        const result = await response.json();

        if (result.status === "success") {
          localStorage.setItem('userName', result.nama);
          localStorage.setItem('userRole', result.role);
          localStorage.setItem('userKelas', result.kelas);
          
          tampilkanDashboard(result.nama, result.kelas);
        } else if (result.status === "inactive") {
          statusText.style.color = "red";
          statusText.textContent = "Gagal: Akun tidak aktif / sudah lulus.";
        } else {
          statusText.style.color = "red";
          statusText.textContent = "NISN tidak ditemukan di database sekolah!";
        }
      } catch (error) {
        console.error("Error:", error);
        statusText.style.color = "red";
        statusText.textContent = "Terjadi kesalahan jaringan atau URL Apps Script salah.";
      }
    }

    // Fungsi Menampilkan Dashboard
    function tampilkanDashboard(nama, kelas) {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('dashboard-section').style.display = 'block';
      document.getElementById('welcomeText').textContent = `Selamat datang, ${nama}!`;
      document.getElementById('infoKelas').textContent = `Kelas/Status: ${kelas}`;
      
      loadJadwalTerkonfirmasi();
    }

    // Fungsi Logout
    function handleLogout() {
      localStorage.clear();
      location.reload();
    }

    // Fungsi Mengirim Reservasi ke Firebase
    async function kirimReservasi() {
      const tanggal = document.getElementById('tanggalResv').value;
      const keperluan = document.getElementById('keperluanResv').value;
      const namaUser = localStorage.getItem('userName');
      const kelasUser = localStorage.getItem('userKelas');

      if (!tanggal || !keperluan) {
        alert("Tanggal dan keperluan harus diisi!");
        return;
      }

      try {
        await db.collection('reservasi').add({
          nama: namaUser,
          kelas: kelasUser,
          tanggal: tanggal,
          keperluan: keperluan,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Reservasi berhasil dikirim! Menunggu persetujuan Admin.");
        document.getElementById('keperluanResv').value = ''; 
      } catch (e) {
        console.error("Gagal mengirim:", e);
        alert("Gagal mengirim ke database Firebase.");
      }
    }

    // Fungsi Memuat Jadwal dari Firebase
    function loadJadwalTerkonfirmasi() {
      const listJadwal = document.getElementById('listJadwal');
      
      db.collection('reservasi')
        .where('status', '==', 'approved')
        .onSnapshot((snapshot) => {
          listJadwal.innerHTML = "";
          if (snapshot.empty) {
            listJadwal.innerHTML = "<li>Belum ada jadwal terkonfirmasi.</li>";
            return;
          }

          snapshot.forEach((doc) => {
            let data = doc.data();
            let li = document.createElement('li');
            li.innerHTML = `<strong>${data.tanggal}</strong>: ${data.keperluan} <br><small>Oleh: ${data.nama} (${data.kelas})</small>`;
            li.style.marginBottom = "10px";
            listJadwal.appendChild(li);
          });
        }, (error) => {
          console.error("Gagal memuat data Firestore:", error);
          listJadwal.innerHTML = "<li style='color:red;'>Gagal memuat data kalender. Cek Rules Firestore!</li>";
        });
    }
  </script>
</body>
</html>
